  <title>Kannan Duraisamy</title>

 
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: black;
      font-family: "Figtree",sans-serif;
    
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* width: 300px;
      height: 450px; */
      width: 90%;              
      max-width: 300px;       
      min-height: 450px;    
      background-color: hsl(0, 0%, 12%);
      color: hsl(0, 0%, 100%);
      border-radius: 20px;
      /* padding-right: 35px; */
      
    }

    .profile-details {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .profile-image {
      display:flex;
      align-items: center;
      justify-content: center;
    }

    img {
      border-radius: 50%;
    }

    .profile-name {
      display: flex;
      align-items: center;
      justify-content: center;
      /* font-size: 30px; */
      font-weight: bold;
    }

    .profile-loc {
      color: hsl(75, 94%, 57%);
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-desc {
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 12px;
    }

    ul {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      row-gap: 10px;
      margin-left: -30px;
    }

    li button {
      width:  220px;
      padding: 10px 0 10px 0;
      border-radius: 5px;
      background-color: hsl(0, 0%, 20%);
      
      border: none;
    }

    li button a {
      text-decoration: none;
      color:hsl(0, 0%, 100%);
      font-size: 12px;
      font-weight: 600;
    }

    a:hover {
      color:hsl(75, 94%, 57%);
    }
    
  </style>
</head>

<div class="container">

    <div class="profile-image"><img src="Kannan1.jpeg" width="50" height="50"></div>
